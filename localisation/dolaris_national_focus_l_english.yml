l_english:

# GENERIC NATIONAL FOCUS
 generic_focus:0 "Generic Focus Tree"
 gen_our_place_under_the_sun:0 "Our Place Under the Sun"
 gen_our_place_under_the_sun_desc:0 "The world is changing, and the people of our nation are forming their opinions on which side our nation shall take. It is now down to the government to affirm this."
 gen_king_and_country:0 "For King and For Country"
 gen_king_and_country_desc:0 "We have chosen to side with monarchism. We must now ensure that this becomes a reality."
 gen_the_past_is_the_future:0 "The Past is the Future"
 gen_the_past_is_the_future_desc:0 "It is obvious that the so called \"ideology of the future\" that is democracy is a faliure, and that it will only lead to corruption and dead. We must uphold monarchism as the true path forwards to the future."
 gen_light_the_match:0 "Light the Match"
 gen_light_the_match_desc:0 "We cannot wait any longer. It is obvious that a peaceful transfer of power will take to long. We must usurp the government immediately!"
 gen_by_legal_means_only:0 "By Legal Means Only"
 gen_by_legal_means_only_desc:0 "We cannot have bloodshed, or the entire foundation of our ideilogy will be shaken. We must force a referendum and peacefully take power in the government."
 gen_reaffirm_the_monarchy:0 "Reaffirm the Monarchy"
 gen_reaffirm_the_monarchy_desc:0 "Our monarchs aren't going away anytime soon. We are moving towards the future, and that future is led by the crown!"
 gen_the_rights_of_the_monarch:0 "The Rights of the Monarch"
 gen_the_rights_of_the_monarch_desc:0 "In the new age, we must make a difficult choice. Some elements in our nation are demanding limits on the power of the monarch. However, this is the path to the much hated democracy, and can mean that the monarch can't act when they need to."
 gen_forwards_with_arnor:0 "Forwards With Arnor"
 gen_forwards_with_arnor_desc:0 "The Great War is rapidly approaching, and we are putting our lot with Arnor Londo. It is important for the security of the world that Atlantis must be defeated, we together with Arnor we shall ensure our victory!"
 gen_independantly_together:0 "Independantly Together"
 gen_independantly_together_desc:0 "Though we have chosen to side with Arnor, it is important that we must retain our identity. We are together, but we are independant from their direct rule."
 gen_our_state_religion:0 "Our State Religion"
 gen_our_state_religion_desc:0 "Arnor is trying to push us towards Goldism, but we must remain defiant. Goldism isn't what [ROOT.GetName] needs. We must make a choice at what we will recognize as our national religion."
 gen_our_economy:0 "Our Economy"
 gen_our_economy_desc:0 "A semi-socialist economy like what Arnor has won't be what brings us to greateness. We must find the path that will usher us into the future."
 gen_a_faithful_government:0 "A Faithful Government"
 gen_a_faithful_government_desc:0 "Arnor has existed for so long as a reason. Their unity, their order, their honor, all a contirbuting factor. We must start to adopt some of these cultural practices to guaruntee that we will survive for just as long as Arnor has."
 gen_adopt_goldism:0 "Adopt Goldism"
 gen_adopt_goldism_desc:0 "Goldism is the worlds biggest religion, and we must formally adopt it as our own."
 gen_the_peoples_economy:0 "The People's Economy"
 gen_the_peoples_economy_desc:0 "A nation is built on the backs of the people, and our economy should be built on uplifting them. We shall start the transition to successfully have a stable semi-socialist economy."
 gen_her_most_loyal_subject:0 "Her Most Loyal Subject"
 gen_her_most_loyal_subject_desc:0 "We are Arnorian in all but name, and we are damn proud of it. If we willingly fall into her sphere of influence, we may get a large boon from the pleased Arnorian monarch."
 gen_stay_out_of_the_fight:0 "Stay Out of the Fight"
 gen_stay_out_of_the_fight_desc:0 "We shouldn't get involved in the Great War. Though we lead with the crown, we shouldn't get tangled with a giant like Arnor and her massive political influence."
 gen_true_neutrality:0 "True Neutrality"
 gen_true_neutrality_desc:0 "We are officially declaring our neutrality from the Great War. We shall instead focus on support our people and preventing massive death."
 gen_civilian_focus:0 "Civilian Focus"
 gen_civilian_focus_desc:0 "Rather than building up guns, we shall build up homes. Rather than make bullets, we shall make roads. Our people are our priority."
 gen_secure_the_borders:0 "Secure the Borders"
 gen_secure_the_borders_desc:0 "Though we declared neutrality, other nations might not respect this. We should fortify our borders and equip our military to be defensively focused."
 gen_the_independant_bloc:0 "The Independant Bloc"
 gen_the_independant_bloc_desc:0 "We pursued neutrality, but it will be an armed neutrality. There exists a faction where other like-minded nations share the same belief. We must try to join it, if we will be allowed in."
 gen_mobilize_the_nation:0 "Mobilize the Nation"
 gen_mobilize_the_nation_desc:0 "It appears that \"armed neutrality\" might actually mean \"pre-emptive strike.\" It would be wise to prepare our economy for such an event."
 gen_prepare_for_the_offensive:0 "Prepare for the Offensive"
 gen_prepare_for_the_offensive_desc:0 "It is becoming increasingly clear that the Neutral Bloc may make its move soon. As such, we should equip our army to make a swift and devastating strike."
 gen_toe_the_middle_line:0 "Toe the Middle Line"
 gen_toe_the_middle_line_desc:0 "We shouldn't get invlved in the Great War. Even more, we should get rid of the influences of outdated and corrupt ideologies."
 gen_denounce_the_blocs:0 "Denounce the Blocs"
 gen_denounce_the_blocs_desc:0 "Both Arnor's and Atlantis' zealous followings will be the death of each other and the world. We must get it through to the stubborn hold outs of the nation that our survival depends on walking the middle path."
