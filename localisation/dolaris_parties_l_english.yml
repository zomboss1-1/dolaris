l_english:
 anarchism:0 "Anarchist"
 anarchism_noun:0 "Anarchism"
 anarchism_desc:0 "Anarchist state“
 collective_anarchism:0 "Collective Anarchism
 collective_anarchism_desc:0 "The followers of Collective Anarchism believe that everyone in the state should own the means of production and that the worker should be able to enjoy the results of their own labor. This is usually ensured by collective groups such as trade unions."
 individual_anarchism:0 "Individual Anarchism"
 individual_anarchism_desc:0 "Individual Anarchism puts the emphasis on a person's ability to govern themselves above the bounds of social rules, systems, and norms. This does not necessarily mean that a person doesn’t work with others, but rather works with others in pursuit of their own self-interest. It is believed that a form of natural selection based on responsibility, integrity, and morals is the key to keeping this system stable."
 disorganized_anarchism:0 "Disorganized Anarchism"
 disorgnized_anarchism_desc:0 "Also known as lawlessness, this form of Anarchism emerges when the worst has happened. There is no social order, violence and criminal activity are a staple, and the state ceases to exist. Order and chaos reign, and any person would be hard pressed to reform the state, with or without force."
 
 monarchism:0 "Monarchy"
 monarchism_noun:0 "Monarchism"
 monarchism_desc:0 "Monarchist regime"
 absolute_monarchy:0 "Absolute Monarchism"
 absolute_monarchy_desc:0 "The monarch has absolute power over the state. However, they are still bound to the wants and needs of the people. A new monarch is chosen through a pre-established system, such as bloodlines or a council."
 constitutional_monarchy:0 "Constitutional Monarchism"
 constitutional_monarchy_desc:0 "The monarch is bound by a constitution limiting their power. Often there is a democratic council associated with the constitution, making changes as needed and keeping the power of the monarch in check."

