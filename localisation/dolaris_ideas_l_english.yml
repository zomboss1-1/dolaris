#ARNORIAN NATIONAL SPIRITS
 ARL_treaty_of_atland:0 "The Treaty of Atland"
 ARL_treaty_of_atland_desc:0 "Following the loss of the First Great War, Atlantis put Arnor Londo under the stipulations of the treaty of Atland. The treaty essentially crippled the already weakened Arnor Londo, and knocked them out of the world stage as a major power. This has caused divisions in Arnor Londo, but also has fueled the nations hatred of Atlantis even more."
 ARL_divided_nation:0 "Divided Nation"
 ARL_divided_nation_desc:0 "Following the First Great War, the social cohesion of Arnor Londo tore apart at the seams. Now, the monarchy must deal with foreign agents, heretics, political opposition, and terror groups if it wants to bring stability back to the nation."
 ARL_birthplace_of_goldism:0 "The Birthplace of Goldism"
 ARL_birthplace_of_goldism_desc:0 "Arnor Londo was the birhtthplace of the great religion of Goldism. As such, it holds great significance around the globe."
