l_english:
 1900_between_two_giants:0 "Between Two Giants"
 1900_between_two_giants_desc:0 "The year is 1905. The world stands on the precipice of disaster. Following the First Great War and Arnor Londo's defeat at the hands of Atlantis, democracy has reigned. However, the oppressive nature of Atlantis to anyone who isn't the homeland, heavy internal corruption, and being surrounded by unstable allies has left the government hanging onto both the support of the people and the expansive colonial empire by a thread. Meanwhile, Arnor Londo is grappling with the consequences of the Treaty of Atland and internal divisions are crippling the ancient kingdom, which had already been brought to its knees. \nMeanwhile, the rest of the world is caught in the middle of these two powers, and they each have their decisions to make about their future. Do they see democracy as their chance for survival, or do they think the monarchs will prevail? Or will they forge theor own future? With the looming threat of another Great War, massive instabilities, and old grivences, it would be a bumpy road. And there are whispers in the dark, rumors about Anarchists preparing to come back to the limelight. \nThe days ahead will be difficult. Survival is not a guaruntee. But every nation, every person, no matter how big or small, will write the next chapter of the book of history."
 1900_between_two_giants_ARL:0 "The Golden King of Arnor Londo, Andrej Ciernik has been struggling to hold together a country that has been tearing apart at its seams since the embarrassment of the First Great War. He knows the fate of Arnor Londo relies on the presence of monarchism around the globe, and the weakening control of Atlantis is the golden opportunity to uplift monarchism and the golden religion. He also knows that such a course of action will lead to war with the worlds most powerful nation and her allies. \nAndrej must now unite the nation once more, no small challenge considering that Atlantis still holds Arnor Londo to the treaty of Atland, which prevents colonization, the formation of a faction, the expansion of their military past a certain point, the influencing of monarchism and goldism in other nations, the forced trade of a significant amount of rescources, and many other crippling clauses. The days ahead will prove to be a challenge, between the treaty and building up for all out war, but Andrej will do what he can to bring Arnor Londo back to greatness."
 1900_between_two_giants_ATL:0 "Akilla can see the future of Atlantis. The center of the global economy, the industrial super power, the enforcers of the world, the new global order. Ever since the defeat of Arnor Londo in the First Great War and his election 10 years later, he has been hellbent on propelling Atlantis' economic might to levels that would be unfathomable to anyone but him. \nHowever, Atlantis' grip over the world and her colonies have been growing unsteady. Reckless investments into the economy have left the government without money, unable to pay back the purchases that are being made by the government. The rising debt, the massive defaulting on bonds and the rising interest from loans are leaving the future of Atlantis' industrial boom uncertain, and there is talk of Akilla losing the next election. \nIt also doesn't help that Atlantis is having to make massive purchases of military equipment just to be able to get a hold of her own colonies and prevent the aligned ideologies from losing the  revolutions happening around the globe. This paired with the rise of Arnor Londo leaves Atlantis on the verge of falling from her throne and being usurped by the hated monarchies, something that would cause the death of democracy everywhere. \nHow this will be handled is unknown to everyone except Akilla..."
 1900_BETWEEN_TWO_GIANTS_HISTORY:0 "Squashed between Arnor and Atlantis, the nations of the world, big and small, are stuck. They are forced to make decisions that they don't want to make; take a side or perish AROne. But they aren't insignificant. Even the smallest nation could spell disaster for the giants. What is the future that will be forged by these little knights? Only time will tell..."
