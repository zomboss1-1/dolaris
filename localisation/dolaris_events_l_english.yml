 generic.1.d:0 "The world is ever changing. Political and cultural polarisation, mountain tensions, and a war being concieved right before our very eyes. While the government debates on how to handle the state our world is in, our people are forming their opinions. Which opinions will we choose to start franchising?"
 generic.2.d:0 "While Monarchs have traditionally held absolute power over the nation, liberal ideals and disatisfied populations are demanding limits on the powers of the monarch through a constitution, even opening up national decision making to the population. It is now time to decide what we will chose."
 generic.3.d:0 "[FROM.GetName] has asked to join the [ROOT.GetFactionName] and fight against Atlantis and the [ATL.GetFactionName]."
 generic.4.d:0 "We have decided to reject goldism. However, our people should still unite behind a common faith. However, we can also choose to create a faith around the government and progress by embracing atheism."
 generic.5.d:0 "Arnors Market Socialism is the road to ruin. We need to have a firm stance on whether we will bring the economy entierly under the control of the government, or open it up as a free market for the people. We shall immediately start making the nessecary steps to ensure a smooth transition."
 generic.6.d:0 "[FROM.GetName] has decided to forgo the false promises that have been promised by the major power blocs, and to side with those who pledge neutrality from oppressors."
 generic.7.d:0 "Now that Democracy is solidly a part of our government, we have to make sure that our politics are conducted in the manner that we want. While we might choose a stance that ensures a strong government, it might be wise to consider a democracy that is designed for the direct benifit of the people..."
 generic.8.d:0 "[FROM.GetName] has asked to join the [ROOT.GetFactionName]! If we choose to let them in, they will commit their nation to the great struggle against the Monarchist menace!"