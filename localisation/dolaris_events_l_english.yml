#ARNOR LONDO COUNTRY EVENTS
 ARL.1.t:0 "The Coming Days"
 ARL.1.d:0 "The Kings council sat around a large table, chattering amongst each other. All of them knew the importance of this meeting, which could very well decide whether the Golden Kingdom would prosper or fall. The Atlantian threat loomed ever present on the horizon, and Arnor, though not the only kingdom in the world, was a lonely rock in the midst of a terrible storm. The door opened, and the King in his flowing Golden robes strode in, taking his seat in the ornate chair at the head of the table. The chatter died down immediately. \n'I'm sure you all know what we're here to discuss today,' King Andrej Ciernik started. 'But for those of you who don't, we are meeting to discuss the future of our diplomatic policy so that we can survive the Democratic scourge being led by Atlantis.' \n'I have been presented with three main courses of action. Advisor Radoslav Vavra has proposed that we be as aggressive as we can. While I can see the reasoning behind his words, I worry that this would lead to a war with Atlantis when we aren't prepared for it.' \n'Advisor Svetlana Sevcik has proposed that we speak with promises, and if necessary threats, of power, that those who join us will become strong in a united monarchist coalition and those who oppose us will taste the power of the weapons at our disposal.' \n'Finally, Advisor Julia Rybar has suggested that we can avoid war, or at least prolong it the longest, with diplomacy and compromise. This may be the safest option, but I fear that it may leave us the most unprepared.' \nDiscussion ensued, with advocates for one option or the other trying to win over the King. He patiently listened until he felt that he heard enough to make his decision. He looked at the gathered council, opened his mouth, and said, 'I believe the policy that will lead our nation to victory is...'"
 ARL.1.a:0 "...an aggressive one!"
 ARL.1.b:0 "...leveling our power and influence!"
 ARL.1.c:0 "...through peace and diplomacy!"
 ARL.2.t:0 "The Reformation"
 ARL.2.d:0 "PLACEHOLDER DESCRIPTION"
 ARL.2.a:0 "Fallback onto tradition"
 ARL.2.b:0 "Nationalism will create security"
 ARL.2.c:0 "We must adapt to the modern day to have stability"
